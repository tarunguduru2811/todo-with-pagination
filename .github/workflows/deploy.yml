name: Deploy MERN App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
    
    - name: Build Backend image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/mern-backend:${{ github.sha }} ./backend

    - name: Build Frontend image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/mern-frontend:${{ github.sha }} ./frontend

    - name: Push images to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/mern-backend:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/mern-frontend:${{ github.sha }}
    
    - name: Deocde SSH key
      run: | 
        echo "${{ secrets.EC2_SSH_KEY }}" | base64 --decode > /tmp/private_key.pem
        chmod 600 /tmp/private_key.pem

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key_path: /tmp/private_key.pem
        port: 22
        debug: true
        script: |
          # Set environment variables for Docker Compose
          export MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
          export MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
          export MONGO_INITDB_DATABASE=${{ secrets.MONGO_INITDB_DATABASE }}
          export PORT=${{ secrets.PORT }}
          export MONGODB_URI=${{ secrets.MONGODB_URI }}
          export REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
          export GITHUB_SHA=${{ github.sha }}

          # Pull the latest images using the commit SHA tag
          docker pull ${{ secrets.DOCKER_USERNAME }}/mern-backend:${GITHUB_SHA}
          docker pull ${{ secrets.DOCKER_USERNAME }}/mern-frontend:${GITHUB_SHA}

          # Bring the services down and up again
          docker-compose down
          docker-compose up -d