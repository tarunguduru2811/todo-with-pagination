name: Deploy MERN App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on:  ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
    
    - name: Build backend image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/mern-backend:${{ github.sha }} ./backend
    
    - name: Build Frontend image
      run: | 
        docker build -t ${{ secrets.DOCKER_USERNAME }}/mern-frontend:${{ github.sha }} ./frontend

    - name: Push images to Docker Hub
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/mern-backend:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/mern-frontend:${{ github.sha }}

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: | 
          export GITHUB_SHA=${{ github.sha }}
          export MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
          export MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
          export MONGO_INITDB_DATABASE=${{ secrets.MONGO_INITDB_DATABASE }}
          export PORT=5000
          export MONGODB_URI=mongodb://${{ secrets.MONGO_INITDB_ROOT_USERNAME }}:${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}@mongo:27017/${{ secrets.MONGO_INITDB_DATABASE }}
          export REACT_APP_API_URL=http://backend:5000
          docker pull ${{ secrets.DOCKER_USERNAME }}/mern-backend:${{ github.sha }}
          docker pull ${{ secrets.DOCKER_USERNAME }}/mern-frontend:${{ github.sha }}

          docker-compose down
          docker-compose up -d