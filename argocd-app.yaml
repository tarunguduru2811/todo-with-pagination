apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/tarunguduru2811/todo-with-pagination.git'
    targetRevision: main
    path: helm/mern-app
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: mern-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true